global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [name]
        regex: ''
        action: drop

  - job_name: litellm
    static_configs:
      - targets: ['litellm:4000']
    metrics_path: /metrics
    scrape_timeout: 10s
