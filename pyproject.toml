[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-cli"
version = "1.0.0"
description = "Jarvis — assistant IA self-hosted dans le terminal"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "rich>=13.0",
    "aiohttp>=3.9",
]

[project.scripts]
jarvis = "jarvis_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis_cli*"]
