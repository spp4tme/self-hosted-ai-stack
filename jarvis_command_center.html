<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JARVIS — Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <style>
:root {
  --bg-0: #17140f; --bg-1: #1e1a14; --bg-2: #252019; --bg-elev: #2c2720;
  --line: #38312a; --line-strong: #4a4138; --line-faint: #2a2420;
  --text: #f0ebe3; --text-2: #c8bfb0; --text-3: #8a7f72; --text-4: #5a5248;
  --accent: #c0674a; --accent-soft: rgba(192,103,74,0.15); --accent-line: rgba(192,103,74,0.38);
  --ok: #5aaa78; --warn: #d4a044; --err: #c04444; --idle: #555048;
  --pad: 18px; --pad-tight: 12px; --gap: 14px; --radius: 6px; --tile-min: 200px;
  --sans: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --fs-xxs:9px; --fs-xs:10px; --fs-sm:11px; --fs-md:12px; --fs-lg:13px;
  --fs-h1:32px; --glow:0.4; --scan:0.1;
  color-scheme: dark;
}
html.density-compact { --pad:12px; --pad-tight:8px; --gap:10px; }
html.density-comfy   { --pad:24px; --pad-tight:16px; --gap:18px; }
*, *::before, *::after { box-sizing: border-box; }
html, body, #root { margin:0; padding:0; height:100%; background:var(--bg-0); color:var(--text);
  font-family:var(--sans); font-size:var(--fs-md); line-height:1.4;
  -webkit-font-smoothing:antialiased; overflow:hidden; }
button, input, textarea, select { font:inherit; color:inherit; background:transparent; border:none; outline:none; }
button { cursor:default; }
::selection { background:var(--accent-soft); color:var(--text); }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--line-strong); }
.mono { font-family:var(--mono); }
.dim  { color:var(--text-3); }
.up   { text-transform:uppercase; letter-spacing:0.14em; }
.kbd  { font-family:var(--mono); font-size:var(--fs-xs); padding:1px 5px;
        border:1px solid var(--line); border-radius:3px; color:var(--text-2); background:var(--bg-2); }

#scanlines { position:fixed; inset:0; pointer-events:none; z-index:999;
  background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px,
    rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 3px);
  opacity:var(--scan); mix-blend-mode:overlay; }

#shell { display:grid; grid-template-columns:224px 1fr; grid-template-rows:48px 1fr 26px; height:100vh; }

/* SIDEBAR */
#sidebar { grid-column:1; grid-row:1/span 3; background:var(--bg-1); border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow:hidden; }
.sb-brand { padding:14px 16px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
.sb-mark { width:24px; height:24px; border:1px solid var(--accent-line); border-radius:4px; flex-shrink:0; position:relative;
  background:radial-gradient(circle at 50% 50%, var(--accent-soft) 0%, transparent 60%); }
.sb-mark::after { content:''; position:absolute; inset:5px; border:1px solid var(--accent); border-radius:2px;
  box-shadow:0 0 8px rgba(192,103,74,calc(0.5 * var(--glow))); }
.sb-title { font-weight:600; font-size:var(--fs-lg); letter-spacing:0.02em; }
.sb-sub { font-size:var(--fs-xxs); color:var(--text-3); letter-spacing:0.18em; text-transform:uppercase; margin-top:1px; }
.sb-section { padding:14px 16px 5px; font-size:var(--fs-xxs); color:var(--text-4);
  text-transform:uppercase; letter-spacing:0.18em; }
.sb-nav { display:flex; flex-direction:column; padding:0 8px; gap:1px; }
.sb-item { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:4px;
  font-size:var(--fs-md); color:var(--text-2); cursor:default; user-select:none; position:relative; }
.sb-item:hover { background:var(--bg-2); color:var(--text); }
.sb-item.active { background:var(--bg-2); color:var(--text); }
.sb-item.active::before { content:''; position:absolute; left:-8px; top:7px; bottom:7px;
  width:2px; background:var(--accent); border-radius:1px; box-shadow:0 0 8px rgba(192,103,74,calc(0.6 * var(--glow))); }
.sb-item .idx { color:var(--text-4); font-family:var(--mono); font-size:var(--fs-xs); width:12px; text-align:right; }
.sb-item .lbl { flex:1; }
.sb-item .cnt { color:var(--text-4); font-family:var(--mono); font-size:var(--fs-xs); }
.sb-svc { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:4px;
  font-size:11px; color:var(--text-3); cursor:default; user-select:none; }
.sb-svc:hover { background:var(--bg-2); color:var(--text-2); }
.sb-svc .lbl { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sb-svc .port { font-family:var(--mono); font-size:var(--fs-xxs); color:var(--text-4); }
.sb-footer { margin-top:auto; padding:12px 16px; border-top:1px solid var(--line);
  display:flex; flex-direction:column; gap:6px; }
.sb-meta { font-size:var(--fs-xs); color:var(--text-3); display:flex; justify-content:space-between; }
.sb-meta b { color:var(--text-2); font-weight:500; font-family:var(--mono); }
.sb-scroll { overflow-y:auto; flex:1; min-height:0; padding:0 0 4px; }

/* TOPBAR */
#topbar { grid-column:2; grid-row:1; display:flex; align-items:center; padding:0 16px;
  border-bottom:1px solid var(--line); background:var(--bg-0); gap:16px; }
.tb-crumb { display:flex; align-items:center; gap:8px; color:var(--text-3); font-size:var(--fs-md); }
.tb-crumb b { color:var(--text); font-weight:500; }
.tb-crumb .sep { color:var(--text-4); }
.tb-space { flex:1; }
.tb-pill { display:inline-flex; align-items:center; gap:6px; padding:3px 8px;
  border:1px solid var(--line); border-radius:4px; font-size:var(--fs-xs); color:var(--text-2); font-family:var(--mono); }
.tb-pill.warn { border-color:rgba(212,160,68,0.3); }
.tb-pill.run  { border-color:var(--accent-line); }

/* STATUSBAR */
#statusbar { grid-column:2; grid-row:3; display:flex; align-items:center; gap:16px; padding:0 16px;
  border-top:1px solid var(--line); background:var(--bg-1);
  font-family:var(--mono); font-size:var(--fs-xs); color:var(--text-3); }
#statusbar b { color:var(--text-2); }
.sb-sep { color:var(--text-4); }

/* MAIN */
#main { grid-column:2; grid-row:2; overflow:auto; padding:var(--pad);
  display:flex; flex-direction:column; gap:var(--gap); }

/* DOTS */
.dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; display:inline-block; }
.dot.ok   { background:var(--ok);     box-shadow:0 0 calc(6px * var(--glow)) var(--ok); }
.dot.warn { background:var(--warn);   box-shadow:0 0 calc(6px * var(--glow)) var(--warn); }
.dot.err  { background:var(--err);    box-shadow:0 0 calc(6px * var(--glow)) var(--err); }
.dot.idle { background:var(--idle); }
.dot.acc  { background:var(--accent); box-shadow:0 0 calc(6px * var(--glow)) var(--accent); }
.dot.pulse { animation:dpulse 1.6s ease-in-out infinite; }
@keyframes dpulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.45;transform:scale(0.8)} }

/* CARDS */
.card { background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius);
  display:flex; flex-direction:column; min-height:0; }
.card-h { display:flex; align-items:center; gap:10px; padding:9px var(--pad);
  border-bottom:1px solid var(--line); min-height:36px; }
.card-h .ttl { font-size:var(--fs-md); font-weight:500; }
.card-h .meta { color:var(--text-4); font-size:var(--fs-xs); font-family:var(--mono); }
.card-h .right { margin-left:auto; display:flex; align-items:center; gap:8px; color:var(--text-3); font-size:var(--fs-xs); }
.card-b { padding:var(--pad); display:flex; flex-direction:column; gap:10px; min-height:0; }
.card-b.dense { padding:var(--pad-tight); }
.card-b.flush { padding:0; }
.h-ey { font-size:var(--fs-xxs); color:var(--text-4); text-transform:uppercase; letter-spacing:0.18em; }

/* METRICS */
.metrics { display:grid; grid-template-columns:repeat(5,1fr); gap:var(--gap); }
.metric { background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius);
  padding:11px 13px 9px; display:flex; flex-direction:column; gap:3px; position:relative; overflow:hidden; }
.metric .lbl { font-size:var(--fs-xxs); text-transform:uppercase; letter-spacing:0.18em; color:var(--text-4); }
.metric .val { font-size:24px; font-family:var(--mono); font-weight:500; color:var(--text);
  letter-spacing:-0.02em; line-height:1.1; margin-top:2px; }
.metric .val .unit { font-size:12px; color:var(--text-3); margin-left:2px; }
.metric .sub { font-size:var(--fs-xs); color:var(--text-3); font-family:var(--mono); }
.metric .spk { position:absolute; right:10px; bottom:7px; opacity:0.65; }
.metric.acc .val { color:var(--accent); }
.metric.acc { border-color:var(--accent-line); }

/* SERVICES GRID */
.svc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--tile-min),1fr)); gap:var(--gap); }
.svc-tile { background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 13px 9px; display:flex; flex-direction:column; gap:3px;
  cursor:default; transition:border-color 0.15s, background 0.15s; }
.svc-tile:hover { border-color:var(--line-strong); background:var(--bg-2); }
.svc-tile.clickable:hover { border-color:var(--accent-line); cursor:pointer; }
.svc-tile .top { display:flex; align-items:center; gap:7px; }
.svc-tile .name { font-size:var(--fs-md); font-weight:500; }
.svc-tile .port { font-family:var(--mono); font-size:var(--fs-xxs); color:var(--text-3); margin-left:auto; }
.svc-tile .desc { font-size:var(--fs-xs); color:var(--text-3); }
.svc-tile .bot { display:flex; align-items:center; justify-content:space-between; margin-top:2px; gap:8px; }
.svc-tile .lat { font-family:var(--mono); font-size:var(--fs-xs); color:var(--text-2); }
.svc-tile .lat.warn { color:var(--warn); }
.svc-tile .lat.idle { color:var(--text-4); }

/* SPARKLINE */
.spark path { fill:none; stroke:currentColor; stroke-width:1.2; }
.spark.acc { color:var(--accent); }
.spark.dim { color:var(--text-4); }
.spark.ok  { color:var(--ok); }

/* LOG */
.log { font-family:var(--mono); font-size:var(--fs-xs); line-height:1.65;
  display:flex; flex-direction:column; flex:1; min-height:0; overflow-y:auto; padding:4px 12px 8px; }
.log-row { display:grid; grid-template-columns:76px 46px 88px 1fr; gap:8px; padding:1px 0; }
.log-row:hover { background:var(--bg-2); }
.log-row .ts  { color:var(--text-4); }
.log-row .lvl { color:var(--text-3); }
.log-row .lvl.warn { color:var(--warn); }
.log-row .src { color:var(--text-2); }
.log-row .msg { color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* BUTTONS */
.btn { padding:6px 11px; border:1px solid var(--line); border-radius:4px;
  background:var(--bg-2); color:var(--text); font-size:var(--fs-md);
  cursor:default; display:inline-flex; align-items:center; gap:6px; transition:background 0.12s; }
.btn:hover { background:var(--bg-elev,#302a22); border-color:var(--line-strong); }
.btn.primary { border-color:var(--accent-line); background:var(--accent-soft); color:var(--accent); }
.btn.ghost { background:transparent; border-color:transparent; color:var(--text-3); }
.btn.ghost:hover { color:var(--text); background:var(--bg-2); }
.btn.sm { padding:3px 8px; font-size:var(--fs-xs); }
.btn:disabled { opacity:0.5; }

/* AGENTS */
.agent-list { display:flex; flex-direction:column; gap:5px; }
.agent-card { display:grid; grid-template-columns:22px 1fr auto; padding:9px 11px;
  align-items:center; gap:9px; background:var(--bg-2); border:1px solid var(--line); border-radius:4px; cursor:default; }
.agent-card:hover { border-color:var(--line-strong); }
.agent-card.active { border-color:var(--accent-line); background:var(--accent-soft); }
.agent-card .glyph { width:22px; height:22px; border:1px solid var(--line-strong); border-radius:3px;
  display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; color:var(--text-2); }
.agent-card.active .glyph { border-color:var(--accent); color:var(--accent); }
.agent-card .aname { font-weight:500; font-size:var(--fs-md); display:flex; align-items:center; gap:7px; }
.agent-card .arole { font-size:var(--fs-xs); color:var(--text-3); margin-top:1px; }
.agent-card .amodel { font-family:var(--mono); font-size:var(--fs-xs); color:var(--text-3); }

/* TRACE */
.trace { display:flex; flex-direction:column; gap:7px; font-family:var(--mono); font-size:11px; padding:4px 0; }
.trace-row { display:grid; grid-template-columns:74px 1fr; gap:11px; padding:5px 0; border-bottom:1px dashed var(--line-faint); }
.trace-row:last-child { border-bottom:none; }
.tk { font-size:var(--fs-xxs); text-transform:uppercase; letter-spacing:0.16em;
  padding:2px 5px; border:1px solid var(--line); border-radius:3px; color:var(--text-3);
  height:fit-content; width:fit-content; background:var(--bg-2); }
.tk.tool   { color:var(--accent); border-color:var(--accent-line); }
.tk.critic { color:var(--warn); border-color:rgba(212,160,68,0.4); }
.tk.final  { color:var(--ok);   border-color:rgba(90,170,120,0.4); }
.tk.plan,.tk.draft { color:var(--text-2); }
.t-txt { color:var(--text-2); }
.tcursor { display:inline-block; width:7px; height:11px; background:var(--accent);
  margin-left:2px; vertical-align:-1px; animation:blink 1.05s steps(2,start) infinite; }
@keyframes blink { 50%{opacity:0} }

/* MEMORY */
.mem-bar { display:flex; align-items:center; gap:10px; border:1px solid var(--line);
  background:var(--bg-2); border-radius:4px; padding:5px 11px; margin-bottom:10px; }
.mem-bar input { flex:1; font-size:var(--fs-md); }
.mem-table { display:flex; flex-direction:column; }
.mem-row { display:grid; grid-template-columns:68px 124px 1fr 130px; gap:12px;
  padding:10px 12px; border-bottom:1px solid var(--line); align-items:start; cursor:default; }
.mem-row:hover { background:var(--bg-2); }
.mem-row .mid { color:var(--text-4); font-family:var(--mono); font-size:var(--fs-xs); }
.mem-row .mts { color:var(--text-3); font-family:var(--mono); font-size:var(--fs-xs); }
.mem-row .mtxt { color:var(--text); font-size:var(--fs-md); line-height:1.5; }
.mem-row .mtags { display:flex; flex-wrap:wrap; gap:3px; justify-content:flex-end; }
.tag { font-size:var(--fs-xxs); padding:2px 6px; border:1px solid var(--line); border-radius:12px;
  color:var(--text-3); font-family:var(--mono); text-transform:lowercase; }

/* SANDBOX */
.sbx-grid { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); flex:1; min-height:0; }
.code-area { font-family:var(--mono); font-size:13px; line-height:1.55; padding:13px 15px;
  background:var(--bg-0); border:1px solid var(--line); border-radius:var(--radius);
  flex:1; min-height:0; white-space:pre-wrap; word-break:break-all; color:var(--text-2); }
.code-area .kw { color:var(--accent); }
.code-area .str { color:var(--ok); }
.code-area .num-lit { color:var(--warn); }
.code-area .com { color:var(--text-4); font-style:italic; }
.out-area { font-family:var(--mono); font-size:13px; background:var(--bg-0);
  border:1px solid var(--line); border-radius:var(--radius); padding:13px 15px;
  flex:1; min-height:0; white-space:pre; color:var(--text-2); overflow:auto; }
.runline { display:flex; align-items:center; gap:10px; padding:0 0 10px; }
.runline .meta { margin-left:auto; font-family:var(--mono); font-size:var(--fs-xs); color:var(--text-3); display:flex; gap:12px; }
.cstr { display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:var(--fs-xs); color:var(--text-3); }

/* VISION */
.vis-grid { display:grid; grid-template-columns:1.1fr 1fr; gap:var(--gap); flex:1; min-height:0; }
.dropzone { flex:1; min-height:260px; border:1px dashed var(--line-strong); border-radius:var(--radius);
  background:repeating-linear-gradient(135deg, transparent 0, transparent 14px, rgba(255,255,255,0.02) 14px, rgba(255,255,255,0.02) 16px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--text-3); font-family:var(--mono); font-size:11px; text-align:center; padding:24px; gap:6px; }
.dropzone b { color:var(--text); }
.mode-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:5px; }
.mode-pill { display:flex; flex-direction:column; gap:2px; padding:7px 9px;
  border:1px solid var(--line); border-radius:4px; background:var(--bg-2); cursor:default; }
.mode-pill:hover { border-color:var(--line-strong); }
.mode-pill.active { border-color:var(--accent-line); background:var(--accent-soft); }
.mode-pill .mn { font-family:var(--mono); font-size:var(--fs-md); color:var(--text); }
.mode-pill.active .mn { color:var(--accent); }
.mode-pill .mh { font-size:var(--fs-xs); color:var(--text-3); }

/* RESOURCE BARS */
.bar { position:relative; height:3px; background:var(--bg-2); border-radius:2px; overflow:hidden; }
.bar > i { position:absolute; left:0; top:0; bottom:0; background:var(--accent); }
.bar > i.ok   { background:var(--ok); }
.bar > i.warn { background:var(--warn); }

/* HOME LAYOUT */
.home-grid { display:grid; grid-template-columns:2fr 1fr; gap:var(--gap); flex:1; min-height:0; }
.col { display:flex; flex-direction:column; gap:var(--gap); min-height:0; }
.hero { display:flex; align-items:flex-end; justify-content:space-between; padding:4px 4px 12px; gap:20px; }
.hero h1 { font-size:var(--fs-h1); font-weight:500; letter-spacing:-0.02em; margin:0; line-height:1.05; }
.hero h1 em { font-style:normal; color:var(--accent); }
.hero .sub { color:var(--text-3); font-size:var(--fs-md); margin-top:5px; max-width:500px; }
.hero .now { font-family:var(--mono); font-size:var(--fs-xs); color:var(--text-3); text-align:right; }
.hero .now b { color:var(--text); font-weight:500; }
.adg { display:grid; grid-template-columns:300px 1fr; gap:var(--gap); flex:1; min-height:0; }
.tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:-1px; }
.tab { padding:6px 11px; font-size:var(--fs-md); color:var(--text-3);
  border:1px solid transparent; border-bottom:none; border-radius:4px 4px 0 0; cursor:default; }
.tab:hover { color:var(--text); }
.tab.active { color:var(--text); border-color:var(--line); background:var(--bg-1); }
.divider { height:1px; background:var(--line); margin:4px 0; }
.row-t { display:flex; align-items:center; gap:7px; }
.empty { color:var(--text-4); padding:22px; text-align:center; font-size:var(--fs-md); }

/* IFRAME PANEL (real services) */
.iframe-panel { position:fixed; top:48px; right:0; bottom:26px; width:70vw; z-index:500;
  background:var(--bg-1); border-left:1px solid var(--line);
  display:flex; flex-direction:column; box-shadow:-4px 0 24px rgba(0,0,0,0.4);
  transform:translateX(100%); transition:transform 0.25s cubic-bezier(0.3,0.7,0.4,1); }
.iframe-panel.open { transform:translateX(0); }
.iframe-bar { display:flex; align-items:center; gap:10px; padding:0 14px; height:38px;
  border-bottom:1px solid var(--line); background:var(--bg-0); flex-shrink:0; }
.iframe-bar .ititle { font-weight:500; font-size:var(--fs-md); }
.iframe-bar .iurl { font-family:var(--mono); font-size:var(--fs-xs); color:var(--text-3); flex:1; }
iframe#svcframe { flex:1; border:none; background:#000; }
.overlay-bg { position:fixed; inset:0; z-index:499; background:rgba(0,0,0,0.3);
  opacity:0; pointer-events:none; transition:opacity 0.25s; }
.overlay-bg.open { opacity:1; pointer-events:all; }

/* TWEAKS */
.tweak-btn { position:fixed; right:16px; bottom:36px; z-index:1000; padding:5px 11px;

function Spark({ data, w=72, h=20, tone='acc' }) {
  const max = Math.max(...data), min = Math.min(...data), range = max - min || 1;
  const step = w / (data.length - 1);
  const d = data.map((v, i) => {
    const x = i * step, y = h - ((v - min) / range) * (h - 2) - 1;
    return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  return <svg className={'spark ' + tone} width={w} height={h} viewBox={'0 0 ' + w + ' ' + h}><path d={d}/></svg>;
}

function ColoredCode({ code }) {
  const KWS = new Set(['import','from','as','def','return','for','in','if','else','elif','print','class','True','False','None']);
  const toks = []; let i = 0;
  while (i < code.length) {
    const ch = code[i];
    if (ch === '"' || ch === "'") {
      const q = ch; let j = i + 1;
      while (j < code.length && code[j] !== q) j++;
      toks.push({ t:'str', v:code.slice(i, j+1) }); i = j+1; continue;
    }
    if (ch === '#') {
      let j = i; while (j < code.length && code[j] !== '\n') j++;
      toks.push({ t:'com', v:code.slice(i, j) }); i = j; continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      let j = i; while (j < code.length && /[A-Za-z0-9_]/.test(code[j])) j++;
      const w = code.slice(i, j);
      toks.push({ t: KWS.has(w) ? 'kw' : 'id', v: w }); i = j; continue;
    }
    if (/[0-9]/.test(ch)) {
      let j = i; while (j < code.length && /[0-9.]/.test(code[j])) j++;
      toks.push({ t:'num-lit', v:code.slice(i, j) }); i = j; continue;
    }
    toks.push({ t:'pn', v:ch }); i++;
  }
  return (
    <pre className="code-area">
      {toks.map((tok, k) => tok.t === 'id' || tok.t === 'pn'
        ? <span key={k}>{tok.v}</span>
        : <span key={k} className={tok.t}>{tok.v}</span>)}
    </pre>
  );
}

// ── STATUSBAR ─────────────────────────────────────────────────────────────
function Statusbar({ services, rpm, tokens, latency }) {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  const up = services.filter(s => s.status === 'up').length;
  const warn = services.filter(s => s.status === 'warn').length;
  const hh = now.getHours().toString().padStart(2,'0');
  const mm = now.getMinutes().toString().padStart(2,'0');
  const ss = now.getSeconds().toString().padStart(2,'0');
  return (
    <footer id="statusbar">
      <span><b>{up}</b>/{services.length} services <span className="sb-sep">·</span> {warn} warn</span>
      <span>req/min <b>{rpm}</b></span>
      <span>tokens <b>{tokens.toLocaleString('fr-FR')}</b></span>
      <span>p50 <b>{latency}ms</b></span>
      <span style={{marginLeft:'auto'}}>litellm <b>:4000</b> <span className="sb-sep">·</span> ollama <b>:11434</b></span>
      <span>{hh}:{mm}:<b>{ss}</b></span>
    </footer>
  );
}

function SandboxView() {
  const [code, setCode] = useState(SAMPLE_CODE);
  const [output, setOutput] = useState(SAMPLE_OUT);
  const [running, setRunning] = useState(false);
  const [dur, setDur] = useState(2.1);
  const run = () => {
    setRunning(true); setOutput('');
    let i = 0; const t0 = performance.now();
    const iv = setInterval(() => {
      i += Math.floor(Math.random()*4)+2;
      if (i >= SAMPLE_OUT.length) { setOutput(SAMPLE_OUT); clearInterval(iv); setRunning(false); setDur((performance.now()-t0)/1000); return; }
      setOutput(SAMPLE_OUT.slice(0, i));

  return (
    <>
      <div className="hero">
        <div><h1>Sandbox <em>Python</em></h1>

    { id:'wf-04', name:'security-scan',    trigger:'cron · 0 2 * * 0',   runs:12,  status:'warn', last:'il y a 3 j' },
    { id:'wf-05', name:'memory-summarize', trigger:'tag · long-term',    runs:23,  status:'up',   last:'il y a 12 h' },
  ];
  return (
    <>
      <div className="hero">
        <div><h1>Workflows <em>n8n</em></h1>
          <div className="sub">12 workflows. Triggers cron, webhooks GitHub, ou déclenchés par les agents.</div>
        </div>
        <div className="now"><b className="mono">n8n :5678</b><br/>uptime · <b>23h 41min</b></div>
      </div>
      <div className="card" style={{flex:1}}>
        <div className="card-h"><span className="ttl">Workflows actifs</span></div>
        <div className="card-b" style={{flex:1,overflow:'auto'}}>
          <div className="mem-table">
            {wfs.map(wf => (
              <div className="mem-row" key={wf.id} style={{gridTemplateColumns:'60px 1fr 1fr 70px 110px 80px'}}>
                <div className="mid">{wf.id}</div>
                <div className="mtxt">{wf.name}</div>
                <div className="mts">{wf.trigger}</div>
                <div className="mts">{wf.runs} runs</div>
                <div className="mts">{wf.last}</div>
                <div className="mtags"><Dot s={wf.status}/><span className="mono dim" style={{fontSize:10}}>{wf.status}</span></div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

// ── TWEAKS ────────────────────────────────────────────────────────────────
const ACCENT_OPTS = [
  { key:'brick',  color:'#c0674a' },
  { key:'sage',   color:'#5aaa78' },
  { key:'cobalt', color:'#4a82cc' },
  { key:'amber',  color:'#d4a044' },
];
const ACCENT_CSS = {
  brick:  { val:'#c0674a', soft:'rgba(192,103,74,0.15)',  line:'rgba(192,103,74,0.38)' },
  sage:   { val:'#5aaa78', soft:'rgba(90,170,120,0.15)',  line:'rgba(90,170,120,0.35)' },
  cobalt: { val:'#4a82cc', soft:'rgba(74,130,204,0.15)',  line:'rgba(74,130,204,0.35)' },
  amber:  { val:'#d4a044', soft:'rgba(212,160,68,0.15)',  line:'rgba(212,160,68,0.35)' },
};
function TweaksPanel({ t, setTweak, onClose }) {
  const opts = ['compact','regular','comfy'];
  const di = opts.indexOf(t.density);
  return (
    <div className="tweak-panel">
      <div className="tweak-hd">
        <b>Tweaks</b>
        <button className="btn ghost sm" onClick={onClose}>✕</button>
      </div>
      <div className="tweak-body">
        <div className="tweak-sect">Accent</div>
        <div className="tw-chips">
          {ACCENT_OPTS.map(o => (
            <button key={o.key} className={'tw-chip' + (t.accent===o.key?' on':'')}
                    style={{background:o.color}} onClick={() => setTweak('accent', o.key)}/>
          ))}
        </div>
        <div className="tweak-sect">Densité</div>
        <div className="tw-seg">
          <div className="tw-seg-thumb" style={{left:'calc(2px + '+di+'*(100% - 4px)/3)',width:'calc((100% - 4px)/3)'}}/>
          {opts.map((o,i) => (
            <button key={o} className={t.density===o?'on':''} onClick={() => setTweak('density', o)}>{o}</button>
          ))}
        </div>
        <div className="tweak-sect">Effets</div>
        <div className="tw-row">
          <div className="tw-lbl"><span>Glow</span><span>{t.glow.toFixed(2)}</span></div>
          <input type="range" className="tw-slider" min={0} max={1} step={0.05} value={t.glow}
                 onChange={e => setTweak('glow', +e.target.value)}/>
        </div>
        <div className="tw-row">
          <div className="tw-lbl"><span>Scanlines</span><span>{t.scanlines.toFixed(2)}</span></div>
          <input type="range" className="tw-slider" min={0} max={0.6} step={0.02} value={t.scanlines}
                 onChange={e => setTweak('scanlines', +e.target.value)}/>
        </div>
        <div className="tw-row tw-row-h" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:11,color:'var(--text-3)',fontWeight:500}}>Police mono</span>
          <button className={'tw-toggle' + (t.monoUI?' on':'')} onClick={() => setTweak('monoUI', !t.monoUI)}><i/></button>
        </div>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState('home');
  const [model, setModel] = useState('mistral:7b');
  const [services, setServices] = useState(SERVICES);
  const [memory, setMemory] = useState(INIT_MEMORY);
  const [log, setLog] = useState(INIT_LOG);
  const [metrics, setMetrics] = useState({ vram:0, vramPct:0, vramTrend:0, gpuUtil:0, gpuTemp:55, cpu:0, rpm:0, ram:0, ramPct:0, ramTotal:64, vramTotal:16 });
  const [reqHist, setReqHist] = useState(() => sparkline(7,24,18,8,3));
  const [apiUp, setApiUp] = useState(null);
  const [qdrantData, setQdrantData] = useState({ totalVectors:0, collections:0 });
  const [liveModels, setLiveModels] = useState(MODELS);
  const [runningAgent, setRunningAgent] = useState(null);
  const [runningTrace, setRunningTrace] = useState([]);
  const [openSvc, setOpenSvc] = useState(null);
  const [tweakOpen, setTweakOpen] = useState(false);
  const [tweaks, setTweaksState] = useState({ accent:'brick', density:'regular', glow:0.4, scanlines:0.1, monoUI:false });
  const timers = useRef([]);

  const setTweak = useCallback((k, v) => setTweaksState(prev => ({ ...prev, [k]: v })), []);

  // Apply tweaks to CSS vars
  useEffect(() => {
    const r = document.documentElement;
    const acc = ACCENT_CSS[tweaks.accent] || ACCENT_CSS.brick;
    r.style.setProperty('--accent', acc.val);
    r.style.setProperty('--accent-soft', acc.soft);
    r.style.setProperty('--accent-line', acc.line);
    r.style.setProperty('--glow', String(tweaks.glow));
    r.style.setProperty('--scan', String(tweaks.scanlines));
    r.classList.remove('density-compact','density-comfy');
    if (tweaks.density === 'compact') r.classList.add('density-compact');
    if (tweaks.density === 'comfy') r.classList.add('density-comfy');
    const sans = tweaks.monoUI
      ? "'JetBrains Mono',ui-monospace,monospace"
      : "'Space Grotesk',ui-sans-serif,system-ui,sans-serif";
    r.style.setProperty('--sans', sans);
  }, [tweaks]);

  // Poll real metrics from dashboard_api.py every 5s
  useEffect(() => {
    const poll = async () => {
      try {
        const r = await fetch('http://localhost:9200/api/metrics', { signal:AbortSignal.timeout(3000) });
        const d = await r.json();
        setApiUp(true);
        setMetrics(prev => {
          const vramGb = d.vram_used_mb / 1024;
          return { ...prev,
            vram: vramGb, vramTotal: d.vram_total_mb / 1024,
            vramPct: d.vram_total_mb > 0 ? (d.vram_used_mb / d.vram_total_mb) * 100 : 0,
            vramTrend: vramGb - prev.vram,
            gpuUtil: d.gpu_util, gpuTemp: d.gpu_temp,
            cpu: d.cpu_pct, ram: d.ram_used_gb,
            ramTotal: d.ram_total_gb, ramPct: d.ram_pct,
          };
        });
      } catch { setApiUp(false); }
    };
    poll();
    const id = setInterval(poll, 5000);
    return () => clearInterval(id);
  }, []);

  // Sparkline visual ticker
  useEffect(() => {
    const t = setInterval(() => setReqHist(h => [...h.slice(1), Math.max(2, h[h.length-1]+(Math.random()-0.5)*8)]), 3000);
    return () => clearInterval(t);
  }, []);

  // Ping all services for real health + latency every 30s
  useEffect(() => {
    const ping = async () => {
      const results = await Promise.all(SERVICES.map(async svc => {
        const t0 = performance.now();
        try {
          await fetch(svc.url, { mode:'no-cors', signal:AbortSignal.timeout(3000) });
          return { id:svc.id, status:'up', latency:Math.round(performance.now()-t0) };
        } catch { return { id:svc.id, status:'err', latency:0 }; }
      }));
      setServices(prev => prev.map(s => { const r=results.find(x=>x.id===s.id); return r?{...s,status:r.status,latency:r.latency}:s; }));
    };
    ping();
    const id = setInterval(ping, 30000);
    return () => clearInterval(id);
  }, []);

  // Fetch Qdrant collections + total vector count
  useEffect(() => {
    const run = async () => {
      try {
        const r = await fetch('http://localhost:6333/collections', { signal:AbortSignal.timeout(4000) });
        const d = await r.json();
        const cols = d.result?.collections || [];
        let total = 0;
        await Promise.all(cols.map(async c => {
          try {
            const cr = await fetch('http://localhost:6333/collections/'+c.name, { signal:AbortSignal.timeout(4000) });
            const cd = await cr.json();
            total += cd.result?.vectors_count || 0;
          } catch {}
        }));
        setQdrantData({ totalVectors:total, collections:cols.length });
      } catch {}
    };
    run();
    const id = setInterval(run, 60000);
    return () => clearInterval(id);
  }, []);

  // Fetch real Ollama model list every 60s via proxy
  useEffect(() => {
    const run = async () => {
      try {
        const [tagsR, psR] = await Promise.all([
          fetch('http://localhost:9200/api/ollama/tags', { signal:AbortSignal.timeout(4000) }),
          fetch('http://localhost:9200/api/ollama/ps',   { signal:AbortSignal.timeout(4000) }),
        ]);
        const tags = await tagsR.json();
        const ps   = await psR.json();
        const active = new Set((ps.models||[]).map(m=>m.name));
        const models = (tags.models||[]).map(m => ({
          id: m.name,
          size: m.details?.parameter_size || ((m.size||0)/1e9).toFixed(1)+'G',
          usage: m.details?.family || 'general',
          pulls: 0,
          active: active.has(m.name),
        }));
        if (models.length > 0) setLiveModels(models);
      } catch {}
    };
    run();
    const id = setInterval(run, 60000);
    return () => clearInterval(id);
  }, []);

  // Live log tick
  useEffect(() => {
    const t = setInterval(() => {
      const s = LOG_SEEDS[Math.floor(Math.random()*LOG_SEEDS.length)];
      setLog(L => [{ id:'log-'+Date.now(), ts:new Date(), level:s[0], source:s[1], msg:s[2] }, ...L].slice(0,400));
    }, 2800);
    return () => clearInterval(t);
  }, []);

  // Keyboard shortcuts
  useEffect(() => {
    const map = {'1':'home','2':'agents','3':'memory','4':'sandbox','5':'vision','6':'logs','7':'models','8':'workflow','9':'settings'};
    const h = e => {
      if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
      if (map[e.key]) setView(map[e.key]);
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  const runAgent = useCallback((agentId, force=false) => {
    timers.current.forEach(clearTimeout); timers.current = [];
    if (!force && runningAgent === agentId) { setRunningAgent(null); setRunningTrace([]); return; }
    setRunningAgent(agentId); setRunningTrace([]);
    const trace = AGENT_TRACES[agentId] || [];
    let acc = [];
    trace.forEach((step, i) => {
      const delay = 400 + i*1100 + Math.random()*400;
      const tid = setTimeout(() => {
        acc = [...acc, { ...step, streaming: i < trace.length-1 }];
        setRunningTrace([...acc]);
        setLog(L => [{ id:'a-'+Date.now()+i, ts:new Date(), level:'INFO', source:'agents-api',
          msg:'agent='+agentId+'  '+step.kind+'  '+step.text.slice(0,80) }, ...L].slice(0,400));
        if (i === trace.length-1) {
          setTimeout(() => {
            setRunningTrace(t => t.map((s,k) => k===t.length-1 ? {...s,streaming:false} : s));
            setTimeout(() => setRunningAgent(null), 6000);
          }, 800);
        }
      }, delay);
      timers.current.push(tid);
    });
  }, [runningAgent]);

  const addMemory = useCallback(text => {
    const id = 'm-' + String(memory.length + 22).padStart(3,'0');
    const now = new Date();
    const ts = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    setMemory(m => [{ id, ts, tags:['new'], text }, ...m]);
  }, [memory.length]);

  const sparks = useMemo(() => {
    const o = {};
    services.forEach((s, i) => { o[s.id] = sparkline(i+11, 18, 18+i, 9, 3); });
    return o;
  }, [services.length]);

  const counts = useMemo(() => ({
    agents: AGENTS.length, memory: memory.length, models: liveModels.length,
  }), [memory.length]);

  const upSvcs = services.filter(s => s.status === 'up');
  const avgLat = upSvcs.length ? Math.round(upSvcs.reduce((a,s) => a+s.latency, 0) / upSvcs.length) : 0;

  let viewEl;
  const homeProps = { services, sparks, log, runAgent, runningAgent, runningTrace, metrics, reqHist, onOpenSvc:setOpenSvc, qdrantData };
  if (view === 'home')     viewEl = <HomeView {...homeProps}/>;
  else if (view === 'agents')   viewEl = <AgentsView runAgent={runAgent} runningAgent={runningAgent} runningTrace={runningTrace}/>;
  else if (view === 'memory')   viewEl = <MemoryView items={memory} addItem={addMemory} qdrantData={qdrantData}/>;
  else if (view === 'sandbox')  viewEl = <SandboxView/>;
  else if (view === 'vision')   viewEl = <VisionView/>;
  else if (view === 'logs')     viewEl = <LogsView entries={log}/>;
  else if (view === 'models')   viewEl = <ModelsView models={liveModels}/>;
  else if (view === 'workflow') viewEl = <WorkflowView/>;
  else if (view === 'settings') viewEl = <SettingsView/>;
  else viewEl = <HomeView {...homeProps}/>;

  return (
    <>
      <div id="scanlines"/>
      <div id="shell">
        <Sidebar view={view} setView={setView} counts={counts} onOpenSvc={setOpenSvc} services={services}/>
        <Topbar view={view} model={model} setModel={setModel} runningAgent={runningAgent} openPanel={() => setOpenSvc(SERVICES[0])} gpuTemp={Math.round(metrics.gpuTemp)} models={liveModels}/>
        <main id="main">
          {apiUp === false && (
            <div style={{background:'rgba(192,68,68,0.12)',border:'1px solid rgba(192,68,68,0.35)',
              borderRadius:6,padding:'7px 14px',display:'flex',alignItems:'center',gap:10,
              fontSize:11,fontFamily:'var(--mono)',color:'var(--err)',flexShrink:0,marginBottom:'var(--gap)'}}>
              <Dot s="err"/>
              <span>dashboard_api.py hors ligne — métriques GPU/CPU indisponibles</span>
              <span style={{marginLeft:'auto',color:'var(--text-3)'}}>python scripts/dashboard_api.py</span>
            </div>
          )}
          {viewEl}
        </main>
        <Statusbar services={services} rpm={metrics.rpm} tokens={412310} latency={avgLat}/>
      </div>
      <SvcPanel svc={openSvc} onClose={() => setOpenSvc(null)}/>
      {tweakOpen && <TweaksPanel t={tweaks} setTweak={setTweak} onClose={() => setTweakOpen(false)}/>}
      <button className="tweak-btn" onClick={() => setTweakOpen(o => !o)}>Tweaks</button>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
