tls:
  certificates:
    - certFile: /certs/cert.pem
      keyFile: /certs/key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /certs/cert.pem
        keyFile: /certs/key.pem

http:
  middlewares:
    # Supprime les headers qui bloquent les iframes (même comportement que Caddy allow_iframe)
    allow-iframe:
      headers:
        customResponseHeaders:
          X-Frame-Options: ""
          Content-Security-Policy: ""

    # Rate limiting global
    rate-limit:
      rateLimit:
        average: 200
        burst: 100
        period: 1s

    # Headers sécurité HTTPS
    secure-headers:
      headers:
        sslRedirect: true
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    # SSO Authentik forward auth
    authentik-sso:
      forwardAuth:
        address: "http://authentik:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-uid
        authResponseHeadersRegex: "^X-authentik-"
